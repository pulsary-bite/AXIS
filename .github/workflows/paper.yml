name: AXIS CI and public feed health
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: axis-ci-feed
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest -v
  research-feed:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AXIS_FEED: coinbase
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Independent market and ephemeral paper cycle
        run: |
          python3 - <<'PY'
          import time, worker, sqlite3
          a=worker.validate(worker.fetch())
          now=int(time.time()*1000)
          db=worker.connect(':memory:')
          s=worker.advance(db,a,now)
          print('Public research feed:',worker.source())
          print('Closed candles:',len(a))
          print('Model gate:',s['ml']['reason'])
          print('Ephemeral paper cycle OK; no state or trade data uploaded')
          PY
