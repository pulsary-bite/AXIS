name: AXIS CI and public feed health
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: axis-ci-feed
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bb5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest -v
      - name: Public closed-candle feed check
        if: github.event_name != 'push'
        run: |
          python3 - <<'PY'
          import time, worker, model
          a=worker.validate(worker.fetch())
          if a[-1][0]+worker.HOUR>int(time.time()*1000) or int(time.time()*1000)-(a[-1][0]+worker.HOUR)>2*worker.HOUR:
              raise RuntimeError('Invalid or stale candle')
          if len(a)<600:
              raise RuntimeError('Insufficient ML history')
          r=model.train(a)
          print('Public feed OK; candle count:',len(a))
          print('Model gate:',r['reason'])
          PY
